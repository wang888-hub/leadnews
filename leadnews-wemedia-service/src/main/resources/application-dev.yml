server:
  port: 51803
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/leadnews_wemedia?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MATERIAL_MAX_FILE_SIZE:5MB}
      max-request-size: ${MATERIAL_MAX_FILE_SIZE:5MB}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.aaliyun.leadnews.model.ai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

audit:
  enabled: ${AUDIT_ENABLED:true}
  # 30s AI timeout * (1 initial + 1 internal retry) + backoff/local work + safety margin.
  running-timeout: ${AUDIT_RUNNING_TIMEOUT:PT90S}
  recovery-scan-interval: ${AUDIT_RECOVERY_SCAN_INTERVAL:PT30S}
  task-retry-backoff: ${AUDIT_TASK_RETRY_BACKOFF:PT5S}
  dispatch-batch-size: ${AUDIT_DISPATCH_BATCH_SIZE:50}
  max-attempts: ${AUDIT_MAX_ATTEMPTS:3}
  sensitive-words:
    version-check-interval: ${AUDIT_SENSITIVE_WORD_CHECK_INTERVAL:PT30S}
  resilience:
    max-concurrent: ${AUDIT_AI_MAX_CONCURRENT:4}
    acquire-timeout: ${AUDIT_AI_ACQUIRE_TIMEOUT:PT0.05S}
    failure-threshold: ${AUDIT_AI_FAILURE_THRESHOLD:5}
    open-duration: ${AUDIT_AI_OPEN_DURATION:PT30S}
    half-open-permits: ${AUDIT_AI_HALF_OPEN_PERMITS:1}
    manual-review-backlog-limit: ${AUDIT_MANUAL_BACKLOG_LIMIT:500}
    capacity-retry-backoff: ${AUDIT_CAPACITY_RETRY_BACKOFF:PT2S}
    circuit-retry-backoff: ${AUDIT_CIRCUIT_RETRY_BACKOFF:PT30S}
    invalid-response-max-attempts: ${AUDIT_INVALID_RESPONSE_MAX_ATTEMPTS:2}
  ai:
    model: ${AI_MODEL:qwen3.8-max}
    auto-pass-confidence-threshold: ${AUDIT_AUTO_PASS_THRESHOLD:0.85}
    auto-reject-confidence-threshold: ${AUDIT_AUTO_REJECT_THRESHOLD:0.90}
    max-images: ${AUDIT_AI_MAX_IMAGES:5}
    max-text-length: ${AI_SAFE_TEXT_LIMIT:20000}
  kafka:
    topic: ${AUDIT_TOPIC:leadnews.wemedia.audit}
    dlt-topic: ${AUDIT_DLT_TOPIC:leadnews.wemedia.audit.DLT}

leadnews:
  ai:
    continuation:
      ai-base-url: ${AI_SERVICE_BASE_URL:http://localhost:51808}
      min-target-length: ${AI_CONTINUATION_MIN_TARGET_LENGTH:100}
      max-target-length: ${AI_CONTINUATION_MAX_TARGET_LENGTH:1000}
      max-input-length: ${AI_CONTINUATION_MAX_INPUT_LENGTH:20000}
      max-instruction-length: ${AI_CONTINUATION_MAX_INSTRUCTION_LENGTH:500}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:leadnews}
    max-image-size: ${MATERIAL_MAX_IMAGE_SIZE:5242880}
    max-image-pixels: ${MATERIAL_MAX_IMAGE_PIXELS:20000000}
  

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
