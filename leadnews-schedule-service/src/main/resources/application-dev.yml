server:
  port: 51806

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/leadnews_schedule?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

leadnews:
  schedule:
    scan-interval: ${SCHEDULE_SCAN_INTERVAL:PT1S}
    reconcile-interval: ${SCHEDULE_RECONCILE_INTERVAL:PT1M}
    retry-delay: ${SCHEDULE_RETRY_DELAY:PT10S}
    running-timeout: ${SCHEDULE_RUNNING_TIMEOUT:PT5M}
    max-retries: ${SCHEDULE_MAX_RETRIES:3}
    scan-batch-size: ${SCHEDULE_SCAN_BATCH_SIZE:100}
    worker-core-size: ${SCHEDULE_WORKER_CORE_SIZE:4}
    worker-max-size: ${SCHEDULE_WORKER_MAX_SIZE:8}
    worker-queue-capacity: ${SCHEDULE_WORKER_QUEUE_CAPACITY:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
