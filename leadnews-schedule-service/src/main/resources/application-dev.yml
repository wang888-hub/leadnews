server:
  port: 51806

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/leadnews_schedule?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

leadnews:
  schedule:
    preload-window: ${SCHEDULE_PRELOAD_WINDOW:PT30S}
    scan-interval: ${SCHEDULE_SCAN_INTERVAL:PT1S}
    retry-delay: ${SCHEDULE_RETRY_DELAY:PT10S}
    max-retries: ${SCHEDULE_MAX_RETRIES:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
