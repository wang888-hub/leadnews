server:
  port: 51804

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/leadnews_behavior?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: leadnews-behavior-persistence
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.aaliyun.leadnews.model.behavior
        spring.json.value.default.type: com.aaliyun.leadnews.model.behavior.BehaviorEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
    streams:
      application-id: ${HOT_STREAM_APPLICATION_ID:leadnews-hot-score-stream-v1}
      state-dir: ${HOT_STREAM_STATE_DIR:${java.io.tmpdir}/leadnews-hot-score-stream-v1}
      properties:
        processing.guarantee: exactly_once_v2

leadnews:
  behavior:
    topic: ${BEHAVIOR_TOPIC:leadnews.behavior.events}
    dlt-topic: ${BEHAVIOR_DLT_TOPIC:leadnews.behavior.events.DLT}
    send-timeout-millis: ${BEHAVIOR_SEND_TIMEOUT_MILLIS:5000}
    pending-retry-millis: ${BEHAVIOR_PENDING_RETRY_MILLIS:5000}
    like-cooldown: ${BEHAVIOR_LIKE_COOLDOWN:PT1H}
    collect-cooldown: ${BEHAVIOR_COLLECT_COOLDOWN:PT1H}
    like-first-heat: ${BEHAVIOR_LIKE_FIRST_HEAT:2}
    like-repeat-heat: ${BEHAVIOR_LIKE_REPEAT_HEAT:1}
    like-cancel-heat: ${BEHAVIOR_LIKE_CANCEL_HEAT:1}
    collect-first-heat: ${BEHAVIOR_COLLECT_FIRST_HEAT:5}
    collect-repeat-heat: ${BEHAVIOR_COLLECT_REPEAT_HEAT:2}
    collect-cancel-heat: ${BEHAVIOR_COLLECT_CANCEL_HEAT:2}
    consumed-event-retention-days: ${BEHAVIOR_CONSUMED_EVENT_RETENTION_DAYS:30}
    view-flush-millis: ${BEHAVIOR_VIEW_FLUSH_MILLIS:1000}
  hot:
    top-n: ${HOT_TOP_N:50}
    realtime-window: ${HOT_REALTIME_WINDOW:PT5S}
    grace: ${HOT_GRACE:PT10S}
    applied-retention: ${HOT_APPLIED_RETENTION:P7D}
    min-score: ${HOT_MIN_SCORE:0.01}
    cooling-factor: ${HOT_COOLING_FACTOR:0.99}
    offline-days: ${HOT_OFFLINE_DAYS:30}
    view-weight: ${HOT_VIEW_WEIGHT:1}
    comment-weight: ${HOT_COMMENT_WEIGHT:5}
    decay-cron: ${HOT_DECAY_CRON:0 * * * * *}
    snapshot-enabled: ${HOT_SNAPSHOT_ENABLED:true}
    snapshot-retention-days: ${HOT_SNAPSHOT_RETENTION_DAYS:7}
    snapshot-interval: ${HOT_SNAPSHOT_INTERVAL:PT30M}

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: leadnews-hot-rebuild
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      log-path: ${XXL_JOB_EXECUTOR_LOG_PATH:./logs/xxl-job-hot}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
